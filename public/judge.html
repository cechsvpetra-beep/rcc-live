<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCC – Zápis úlovku</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111826;
  --field:#1c2433;
  --line:#243244;
  --text:#eef4fb;
  --muted:#9db0c5;
  --green:#22c55e;
  --greenDark:#16a34a;
  --red:#ff6b6b;
  --orange:#f59e0b;
  --blue:#60a5fa;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:16px;
}
.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  width:360px;
  box-shadow:0 0 24px rgba(0,0,0,.45);
  border:1px solid var(--line);
}
h2{
  margin:0 0 14px 0;
}
.topbar{
  position:fixed;
  top:10px;
  right:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.topbar button{
  background:#243141;
  color:white;
  width:auto;
  padding:8px 12px;
}
label{
  display:block;
  margin-top:10px;
  margin-bottom:6px;
  font-size:14px;
  color:#dbe6f3;
}
input, select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #2a3444;
  background:var(--field);
  color:white;
  margin-bottom:10px;
}
input[type="file"]{
  padding:8px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--green);
  color:black;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:var(--greenDark);
}
.secondaryBtn{
  background:#243141;
  color:white;
}
.secondaryBtn:hover{
  background:#2f3f55;
}
#status{
  margin-top:12px;
  font-size:13px;
  min-height:18px;
}
.success{ color:var(--green); }
.error{ color:var(--red); }
.warn{ color:var(--orange); }
.info{ color:var(--blue); }

.metaBox{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}
.infoRow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  background:#0f1725;
  border:1px solid #223143;
  border-radius:10px;
  padding:10px 12px;
}
.infoLabel{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.infoValue{
  font-weight:900;
}
.onlineDot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:8px;
}
.dotOnline{ background:#22c55e; }
.dotOffline{ background:#f59e0b; }

.previewWrap{
  margin-top:4px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:12px;
}
.previewBox{
  width:74px;
  height:74px;
  border-radius:12px;
  border:1px dashed #38506b;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#8ea0b3;
  font-size:11px;
  background:#0d1522;
}
.previewBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.smallText{
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}
.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:6px;
}
.note{
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
</style>
</head>

<body>

<div class="topbar">
  <button class="secondaryBtn" onclick="reloadData()">Obnoviť</button>
  <button class="secondaryBtn" onclick="logout()">Odhlásiť</button>
</div>

<div class="card">
  <h2>Zápis úlovku</h2>

  <div class="metaBox">
    <div class="infoRow">
      <div class="infoLabel">Stav pripojenia</div>
      <div class="infoValue" id="connectionState">
        <span class="onlineDot dotOnline"></span>Online
      </div>
    </div>

    <div class="infoRow">
      <div class="infoLabel">Dostupné tímy</div>
      <div class="infoValue" id="teamCount">0</div>
    </div>
  </div>

  <label>Sektor</label>
  <select id="sector"></select>

  <label>Tím</label>
  <select id="team"></select>

  <label>Váha (kg)</label>
  <input type="number" id="weight" step="0.01" min="0" inputmode="decimal">

  <label>Fotka</label>
  <input type="file" id="photo" accept="image/*" onchange="previewPhoto()">

  <div class="previewWrap">
    <div class="previewBox" id="photoPreview">bez foto</div>
    <div class="smallText">
      Zápis sa odošle priamo na server. Po úspechu sa formulár vyčistí.
    </div>
  </div>

  <div class="actionRow">
    <button onclick="saveCatch()">Uložiť úlovok</button>
    <button class="secondaryBtn" onclick="clearForm()">Vyčistiť</button>
  </div>

  <div id="status"></div>

  <div class="note">
    Ak sa zápis nepodarí, stránka zobrazí presnú chybu servera. Váhu môžeš zadať aj s čiarkou, napríklad 12,45.
  </div>
</div>

<script>
let state = null;

async function checkLogin() {
  try {
    const res = await fetch("/api/me", {
      cache: "no-store",
      credentials: "same-origin"
    });

    if (!res.ok) {
      window.location.href = "/login.html";
      return false;
    }

    const user = await res.json();

    if (!user) {
      window.location.href = "/login.html";
      return false;
    }

    return true;
  } catch (e) {
    window.location.href = "/login.html";
    return false;
  }
}

async function load() {
  updateConnectionUI();

  try {
    const res = await fetch("/api/state", {
      cache: "no-store",
      credentials: "same-origin"
    });

    if (!res.ok) {
      throw new Error("Načítanie /api/state zlyhalo");
    }

    state = await res.json();

    renderSectors();
    renderTeams();
    updateTeamCount();
    setStatus("Dáta načítané", false, "success");
  } catch (e) {
    console.error(e);
    setStatus("Chyba načítania dát", true, "error");
  }
}

function renderSectors() {
  const sectorEl = document.getElementById("sector");
  if (!sectorEl || !state?.lb) return;

  sectorEl.innerHTML = "";

  const sectors = [...new Set(
    state.lb
      .filter(t => t && t.sector)
      .map(t => t.sector)
  )].sort((a, b) => String(a).localeCompare(String(b)));

  sectors.forEach(s => {
    sectorEl.innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
  });

  sectorEl.onchange = renderTeams;
}

function renderTeams() {
  const sector = document.getElementById("sector").value;
  const el = document.getElementById("team");
  if (!el || !state?.lb) return;

  el.innerHTML = "";

  state.lb
    .filter(t => t.sector === sector)
    .sort((a, b) => Number(a.id) - Number(b.id))
    .forEach(t => {
      el.innerHTML += `
        <option value="${t.id}">
          ${escapeHtml(t.name)} – Stanovište ${escapeHtml(String(t.peg))}
        </option>
      `;
    });
}

function updateTeamCount() {
  const el = document.getElementById("teamCount");
  if (!el || !state?.lb) return;
  el.textContent = String(state.lb.length || 0);
}

function previewPhoto() {
  const input = document.getElementById("photo");
  const preview = document.getElementById("photoPreview");

  if (!input || !preview) return;

  const file = input.files && input.files[0];
  if (!file) {
    preview.innerHTML = "bez foto";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    preview.innerHTML = `<img src="${reader.result}" alt="preview">`;
  };
  reader.readAsDataURL(file);
}

function normalizeWeight(val) {
  const parsed = Number(String(val ?? "").trim().replace(",", "."));
  if (!Number.isFinite(parsed)) return 0;
  return Math.round(parsed * 100) / 100;
}

async function saveCatch() {
  const teamId = Number(document.getElementById("team").value || 0);
  const weight = normalizeWeight(document.getElementById("weight").value);

  if (!teamId) {
    setStatus("Vyber tím", true, "error");
    return;
  }

  if (!weight || weight <= 0) {
    setStatus("Zadaj platnú váhu", true, "error");
    return;
  }

  const form = new FormData();
  form.append("teamId", String(teamId));
  form.append("weight", String(weight));

  const file = document.getElementById("photo").files[0];
  if (file) {
    form.append("photo", file);
  }

  try {
    setStatus("Ukladám úlovok...", false, "info");

    const res = await fetch("/api/catch", {
      method: "POST",
      body: form,
      credentials: "same-origin"
    });

    const contentType = res.headers.get("content-type") || "";

    if (!contentType.includes("application/json")) {
      setStatus("Server nevrátil platnú odpoveď", true, "error");
      return;
    }

    const out = await res.json();

    if (res.status === 401 || out.code === "AUTH_REQUIRED") {
      setStatus("Relácia vypršala, prihlasujem znova...", true, "warn");
      setTimeout(() => {
        window.location.href = "/login.html";
      }, 1000);
      return;
    }

    if (out.ok) {
      setStatus("ULOŽENÉ ✔", false, "success");
      clearForm();
      await load();
    } else {
      setStatus(out.error || "Chyba pri ukladaní", true, "error");
    }
  } catch (e) {
    console.error(e);
    setStatus("Server je nedostupný alebo spojenie zlyhalo", true, "error");
  }
}

function clearForm() {
  document.getElementById("weight").value = "";
  document.getElementById("photo").value = "";
  document.getElementById("photoPreview").innerHTML = "bez foto";
}

function setStatus(msg, err = false, cls = "") {
  const el = document.getElementById("status");
  if (!el) return;
  el.innerText = msg;
  el.className = cls || (err ? "error" : "success");
}

function updateConnectionUI() {
  const el = document.getElementById("connectionState");
  if (!el) return;

  if (navigator.onLine) {
    el.innerHTML = `<span class="onlineDot dotOnline"></span>Online`;
  } else {
    el.innerHTML = `<span class="onlineDot dotOffline"></span>Offline`;
  }
}

async function reloadData() {
  await load();
}

async function logout() {
  try {
    await fetch("/api/logout", {
      method: "POST",
      credentials: "same-origin"
    });
  } catch (e) {}
  window.location.href = "/login.html";
}

function escapeHtml(text) {
  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

window.addEventListener("online", () => {
  updateConnectionUI();
  setStatus("Pripojenie obnovené", false, "success");
});

window.addEventListener("offline", () => {
  updateConnectionUI();
  setStatus("Internet nie je dostupný", true, "warn");
});

(async function init() {
  const ok = await checkLogin();
  if (!ok) return;
  await load();
})();
</script>

</body>
</html>
