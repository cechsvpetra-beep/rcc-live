<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zápis úlovku</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:36px 16px;
      background:#05070a;
      font-family:Arial,sans-serif;
      color:#eef4fb;
    }
    .card{
      width:100%;
      max-width:380px;
      background:#171717;
      border-radius:16px;
      padding:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    h1{margin:0 0 16px 0}
    label{
      display:block;
      margin:10px 0 6px 0;
      font-size:13px;
      font-weight:bold;
    }
    select,input{
      width:100%;
      border-radius:8px;
      border:1px solid #2c2c2c;
      padding:10px 12px;
      font-size:15px;
      box-sizing:border-box;
    }
    button{
      margin-top:18px;
      width:100%;
      border:none;
      border-radius:10px;
      padding:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      background:#3bc96f;
      color:white;
    }
    #status{
      margin-top:12px;
      font-size:13px;
      color:#9db0c5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Zápis úlovku</h1>

    <label for="sector">Sektor</label>
    <select id="sector" onchange="sectorChanged()"></select>

    <label for="team">Tím</label>
    <select id="team"></select>

    <label for="weight">Váha (kg)</label>
    <input id="weight" type="number" step="0.01" min="0.01">

    <label for="photo">Fotka</label>
    <input id="photo" type="file" disabled>

    <button onclick="saveCatch()">Uložiť úlovok</button>
    <div id="status">Načítavam...</div>
  </div>

  <script>
    let sectors = [];
    let teams = [];

    async function initJudge() {
      try {
        const [sectorsRes, setupRes] = await Promise.all([
          fetch("/api/sectors", { cache: "no-store" }),
          fetch("/api/admin/setup", { cache: "no-store" })
        ]);

        sectors = await sectorsRes.json();
        const data = await setupRes.json();
        teams = Array.isArray(data.teams) ? data.teams : [];

        renderSectors();
        setStatus("Dáta načítané");
      } catch (e) {
        console.error(e);
        setStatus("Chyba načítania dát");
      }
    }

    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.innerText = text;
    }

    function renderSectors() {
      const select = document.getElementById("sector");
      if (!select) return;

      select.innerHTML = `<option value="">Vyber sektor</option>`;

      sectors.forEach((s) => {
        select.innerHTML += `
          <option value="${s.code}">
            ${escapeHtml(s.name)}
          </option>
        `;
      });

      renderTeams();
    }

    function sectorChanged() {
      renderTeams();
    }

    function renderTeams() {
      const sector = document.getElementById("sector")?.value || "";
      const teamSelect = document.getElementById("team");
      if (!teamSelect) return;

      teamSelect.innerHTML = `<option value="">Vyber tím</option>`;

      teams
        .filter(t => t && t.active)
        .filter(t => !sector || t.sector === sector)
        .forEach((t) => {
          teamSelect.innerHTML += `
            <option value="${t.id}">
              ${escapeHtml(t.name)} • Stanovište ${escapeHtml(String(t.peg))}
            </option>
          `;
        });
    }

    async function saveCatch() {
      const sector = document.getElementById("sector")?.value || "";
      const teamId = document.getElementById("team")?.value || "";
      const weight = document.getElementById("weight")?.value || "";

      if (!sector || !teamId || !weight) {
        setStatus("Vyplň sektor, tím a váhu");
        return;
      }

      try {
        const res = await fetch("/api/catch", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            teamId: Number(teamId),
            weight: Number(weight)
          })
        });

        const out = await res.json();

        if (out.ok) {
          const weightInput = document.getElementById("weight");
          if (weightInput) weightInput.value = "";
          setStatus("Úlovok uložený");
        } else {
          setStatus(out.error || "Chyba pri ukladaní");
        }
      } catch (e) {
        console.error(e);
        setStatus("Server neodpovedá");
      }
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    initJudge();
  </script>
</body>
</html>
