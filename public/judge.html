<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCC – Zápis úlovku</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#111826;
  padding:25px;
  border-radius:15px;
  width:320px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h2{
  margin-top:0;
}

input, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  border-radius:8px;
  border:none;
  background:#1c2433;
  color:white;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

#status{
  margin-top:10px;
  font-size:13px;
}

.success{ color:#22c55e; }
.error{ color:#ff6b6b; }

.topbar{
  position:absolute;
  top:10px;
  right:10px;
}

.topbar button{
  background:#243141;
  color:white;
  width:auto;
  padding:8px 12px;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="logout()">Odhlásiť</button>
</div>

<div class="card">
  <h2>Zápis úlovku</h2>

  <label>Sektor</label>
  <select id="sector"></select>

  <label>Tím</label>
  <select id="team"></select>

  <label>Váha (kg)</label>
  <input type="number" id="weight" step="0.01">

  <label>Fotka</label>
  <input type="file" id="photo" accept="image/*">

  <button onclick="saveCatch()">Uložiť úlovok</button>

  <div id="status"></div>
</div>

<script>
let state = null;

async function checkLogin(){
  const res = await fetch("/api/me");
  const user = await res.json();

  if(!user){
    window.location.href = "/login.html";
  }
}

async function load(){
  try{
    const res = await fetch("/api/state");
    state = await res.json();

    renderSectors();
    renderTeams();

  }catch(e){
    setStatus("Chyba načítania", true);
  }
}

function renderSectors(){
  const el = document.getElementById("sector");
  el.innerHTML = "";

  const sectors = [...new Set(state.lb.map(t => t.sector))];

  sectors.forEach(s=>{
    el.innerHTML += `<option value="${s}">${s}</option>`;
  });

  el.onchange = renderTeams;
}

function renderTeams(){
  const sector = document.getElementById("sector").value;
  const el = document.getElementById("team");

  el.innerHTML = "";

  state.lb
    .filter(t => t.sector === sector)
    .forEach(t=>{
      el.innerHTML += `
        <option value="${t.id}">
          ${t.name} – Stanovište ${t.peg}
        </option>
      `;
    });
}

async function saveCatch(){
  const teamId = document.getElementById("team").value;
  const weight = document.getElementById("weight").value;
  const file = document.getElementById("photo").files[0];

  if(!teamId || !weight){
    setStatus("Vyplň údaje", true);
    return;
  }

  try{
    const form = new FormData();
    form.append("teamId", teamId);
    form.append("weight", weight);
    if(file){
      form.append("photo", file); // ⚠️ dôležité
    }

    const res = await fetch("/api/catch", {
      method:"POST",
      body:form
    });

    const out = await res.json();

    if(out.ok){
      setStatus("ULOŽENÉ ✔", false);
      document.getElementById("weight").value = "";
      document.getElementById("photo").value = "";
    }else{
      setStatus(out.error || "Chyba", true);
    }

  }catch(e){
    setStatus("Server neodpovedá", true);
  }
}

function setStatus(text, error=false){
  const el = document.getElementById("status");
  el.innerText = text;
  el.className = error ? "error" : "success";
}

async function logout(){
  await fetch("/api/logout", { method:"POST" });
  window.location.href = "/login.html";
}

checkLogin();
load();
</script>

</body>
</html>
