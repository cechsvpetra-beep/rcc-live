<script>
let sectors = [];
let teams = [];

async function initJudge() {
  try {
    const [sectorsRes, setupRes] = await Promise.all([
      fetch("/api/sectors", { cache: "no-store" }),
      fetch("/api/admin/setup", { cache: "no-store" })
    ]);

    sectors = await sectorsRes.json();
    const data = await setupRes.json();
    teams = Array.isArray(data.teams) ? data.teams : [];

    renderSectors();
    setStatus("Dáta načítané");
  } catch (e) {
    console.error(e);
    setStatus("Chyba načítania dát");
  }
}

function setStatus(text) {
  const el = document.getElementById("status");
  if (el) el.innerText = text;
}

function renderSectors() {
  const select = document.getElementById("sector");
  if (!select) return;

  select.innerHTML = `<option value="">Vyber sektor</option>`;

  sectors.forEach((s) => {
    select.innerHTML += `
      <option value="${s.code}">
        ${escapeHtml(s.name)}
      </option>
    `;
  });

  renderTeams();
}

function sectorChanged() {
  renderTeams();
}

function renderTeams() {
  const sector = document.getElementById("sector")?.value || "";
  const teamSelect = document.getElementById("team");
  if (!teamSelect) return;

  teamSelect.innerHTML = `<option value="">Vyber tím</option>`;

  teams
    .filter(t => t && t.active)
    .filter(t => !sector || t.sector === sector)
    .forEach((t) => {
      teamSelect.innerHTML += `
        <option value="${t.id}">
          ${escapeHtml(t.name)} • Stanovište ${escapeHtml(String(t.peg))}
        </option>
      `;
    });
}

async function saveCatch() {
  const sector = document.getElementById("sector")?.value || "";
  const teamId = document.getElementById("team")?.value || "";
  const weight = document.getElementById("weight")?.value || "";

  if (!sector || !teamId || !weight) {
    setStatus("Vyplň sektor, tím a váhu");
    return;
  }

  try {
    const res = await fetch("/api/catch", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        teamId: Number(teamId),
        weight: Number(weight)
      })
    });

    const out = await res.json();

    if (out.ok) {
      const weightInput = document.getElementById("weight");
      const photoInput = document.getElementById("photo");
      if (weightInput) weightInput.value = "";
      if (photoInput) photoInput.value = "";
      setStatus("Úlovok uložený");
    } else {
      setStatus(out.error || "Chyba pri ukladaní");
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá");
  }
}

function escapeHtml(text) {
  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

initJudge();
</script>
