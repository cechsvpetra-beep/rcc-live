<script>
let state = null;
let setupData = null;
let currentSector = "all";

let previousRankMap = {};
let scrollPos = 0;
let scrollSpeed = 0.55;
let pauseUntil = 0;

function visibleSectors() {
  const sectors = setupData?.sectors || {};
  return Object.values(sectors)
    .filter(s => s && s.visible)
    .sort((a, b) => String(a.code).localeCompare(String(b.code)));
}

function sectorDisplayName(code) {
  const sector = setupData?.sectors?.[code];
  return sector?.name || `Sektor ${code}`;
}

function setSector(code) {
  currentSector = code;

  document.querySelectorAll(".filterBtn").forEach(btn => btn.classList.remove("active"));
  document.querySelectorAll(".filterBtn").forEach(btn => {
    const val = btn.getAttribute("data-sector");
    if (val === code) btn.classList.add("active");
  });

  scrollPos = 0;
  renderStats();
  renderLastCatch();
  renderTop3();
  renderTop3FishTeams();
  renderBoard();
}

function buildFilters() {
  const wrap = document.querySelector(".filters");
  if (!wrap) return;

  const sectors = visibleSectors();

  wrap.innerHTML = `
    <button class="filterBtn ${currentSector === "all" ? "active" : ""}" data-sector="all" onclick="setSector('all')">
      Všetko
    </button>
  `;

  sectors.forEach(sector => {
    wrap.innerHTML += `
      <button class="filterBtn ${currentSector === sector.code ? "active" : ""}" data-sector="${sector.code}" onclick="setSector('${sector.code}')">
        ${sector.code}
      </button>
    `;
  });

  if (
    currentSector !== "all" &&
    !sectors.some(s => s.code === currentSector)
  ) {
    currentSector = "all";
    buildFilters();
  }
}

function filteredLeaderboard() {
  if (!state || !state.lb) return [];

  const visibleCodes = visibleSectors().map(s => s.code);

  let data = state.lb.filter(t => visibleCodes.includes(t.sectorCode || t.sector));

  if (currentSector === "all") return data;

  return data.filter(t => (t.sectorCode || t.sector) === currentSector);
}

function filteredTop3Teams() {
  let data = state?.top3teams || [];
  const visibleCodes = visibleSectors().map(s => s.code);

  data = data.filter(t => visibleCodes.includes(t.sectorCode || t.sector));

  if (currentSector === "all") return data;

  return data.filter(t => (t.sectorCode || t.sector) === currentSector);
}

function medalForPlace(index) {
  if (index === 0) return "🥇";
  if (index === 1) return "🥈";
  if (index === 2) return "🥉";
  return "#" + (index + 1);
}

function rowClass(index) {
  if (index === 0) return "top1";
  if (index === 1) return "top2";
  if (index === 2) return "top3";
  return "";
}

function fmtTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString("sk-SK");
  } catch {
    return iso;
  }
}

function updateClock() {
  const now = new Date();
  const timeEl = document.getElementById("clockTime");
  const dateEl = document.getElementById("clockDate");

  if (timeEl) timeEl.textContent = now.toLocaleTimeString("sk-SK");
  if (dateEl) {
    dateEl.textContent = now.toLocaleDateString("sk-SK", {
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }
}

function renderStats() {
  const totalWeight = document.getElementById("totalWeight");
  const totalFish = document.getElementById("totalFish");
  const topFishWeight = document.getElementById("topFishWeight");
  const topFishTeam = document.getElementById("topFishTeam");

  if (totalWeight) {
    totalWeight.textContent = Number(state?.totalWeight || 0).toFixed(2) + " kg";
  }

  if (totalFish) {
    totalFish.textContent = state?.totalFish || 0;
  }

  if (state?.topFish) {
    if (topFishWeight) topFishWeight.textContent = Number(state.topFish.weight).toFixed(2) + " kg";
    if (topFishTeam) topFishTeam.textContent = state.topFish.team;
  } else {
    if (topFishWeight) topFishWeight.textContent = "0.00 kg";
    if (topFishTeam) topFishTeam.textContent = "—";
  }
}

function getLastCatch() {
  let last = null;
  let lastTeam = null;

  Object.keys(state?.teamCatches || {}).forEach(teamId => {
    const arr = state.teamCatches[teamId] || [];
    arr.forEach(c => {
      if (!last || new Date(c.time) > new Date(last.time)) {
        last = c;
        const team = state.lb.find(t => Number(t.id) === Number(teamId));
        lastTeam = team ? team.name : ("Tím " + teamId);
      }
    });
  });

  return { last, lastTeam };
}

function renderLastCatch() {
  const lastCatchText = document.getElementById("lastCatchText");
  const lastCatchSub = document.getElementById("lastCatchSub");

  const out = getLastCatch();

  if (!out.last) {
    if (lastCatchText) lastCatchText.textContent = "Zatiaľ bez úlovku";
    if (lastCatchSub) lastCatchSub.textContent = "Čakám na prvú rybu…";
    return;
  }

  if (lastCatchText) {
    lastCatchText.textContent = `${out.lastTeam} • ${Number(out.last.weight).toFixed(2)} kg`;
  }

  if (lastCatchSub) {
    lastCatchSub.textContent = fmtTime(out.last.time);
  }
}

function renderTop3() {
  const wrap = document.getElementById("top3List");
  if (!wrap) return;

  wrap.innerHTML = "";

  const top3 = filteredLeaderboard().slice(0, 3);

  if (!top3.length) {
    wrap.innerHTML = `<div style="color:#9cb0c5;">Zatiaľ bez poradia</div>`;
    return;
  }

  top3.forEach((team, index) => {
    wrap.innerHTML += `
      <div class="top3Item">
        <div class="top3Left">
          <div class="top3Medal">${medalForPlace(index)}</div>
          <div class="top3Name">${team.name}</div>
        </div>
        <div class="top3Weight">${Number(team.total).toFixed(2)} kg</div>
      </div>
    `;
  });
}

function renderTop3FishTeams() {
  const body = document.getElementById("top3FishBody");
  if (!body) return;

  body.innerHTML = "";

  const data = filteredTop3Teams().slice(0, 3);

  if (!data.length) {
    body.innerHTML = `<tr><td colspan="2" style="color:#9cb0c5;">Bez dát</td></tr>`;
    return;
  }

  data.forEach(team => {
    body.innerHTML += `
      <tr>
        <td>${team.name}</td>
        <td class="sum">${Number(team.top3sum || 0).toFixed(2)} kg</td>
      </tr>
    `;
  });
}

function renderBoard() {
  const scroller = document.getElementById("boardScroller");
  if (!scroller) return;

  const data = filteredLeaderboard();
  scroller.innerHTML = "";

  if (!data.length) {
    scroller.innerHTML = `
      <div style="padding:28px;font-size:28px;color:#9cb0c5;">
        Zatiaľ bez aktívnych tímov.
      </div>
    `;
    return;
  }

  const currentRankMap = {};
  data.forEach((team, index) => {
    currentRankMap[team.id] = index + 1;
  });

  data.forEach((team, index) => {
    const oldRank = previousRankMap[team.id];
    let motionClass = "";

    if (oldRank && oldRank !== index + 1) {
      motionClass = oldRank > index + 1 ? "up changed" : "down changed";
    }

    scroller.innerHTML += `
      <div class="row ${rowClass(index)} ${motionClass}">
        <div class="place">${medalForPlace(index)}</div>
        <div class="teamBlock">
          <div class="teamName">${team.name}</div>
          <div class="teamMeta">
            ${team.count} úlovkov • najväčšia ${Number(team.biggest).toFixed(2)} kg
          </div>
        </div>
        <div>${sectorDisplayName(team.sectorCode || team.sector)}</div>
        <div>${team.peg}</div>
        <div class="weight">${Number(team.total).toFixed(2)} kg</div>
      </div>
    `;
  });

  if (data.length > 8) {
    data.forEach((team, index) => {
      scroller.innerHTML += `
        <div class="row ${rowClass(index)}" style="opacity:.92;">
          <div class="place">${medalForPlace(index)}</div>
          <div class="teamBlock">
            <div class="teamName">${team.name}</div>
            <div class="teamMeta">
              ${team.count} úlovkov • najväčšia ${Number(team.biggest).toFixed(2)} kg
            </div>
          </div>
          <div>${sectorDisplayName(team.sectorCode || team.sector)}</div>
          <div>${team.peg}</div>
          <div class="weight">${Number(team.total).toFixed(2)} kg</div>
        </div>
      `;
    });
  }

  previousRankMap = currentRankMap;
}

function animateBoard() {
  const viewport = document.querySelector(".boardViewport");
  const scroller = document.getElementById("boardScroller");

  if (!viewport || !scroller) {
    requestAnimationFrame(animateBoard);
    return;
  }

  const viewportHeight = viewport.clientHeight;
  const contentHeight = scroller.scrollHeight;

  if (contentHeight <= viewportHeight) {
    scroller.style.transform = `translateY(0px)`;
    requestAnimationFrame(animateBoard);
    return;
  }

  const now = Date.now();

  if (now < pauseUntil) {
    requestAnimationFrame(animateBoard);
    return;
  }

  scrollPos += scrollSpeed;

  const half = contentHeight / 2;

  if (scrollPos >= half) {
    scrollPos = 0;
    pauseUntil = Date.now() + 1200;
  }

  scroller.style.transform = `translateY(-${scrollPos}px)`;
  requestAnimationFrame(animateBoard);
}

async function loadTV() {
  try {
    const [stateRes, setupRes] = await Promise.all([
      fetch("/api/state", { cache: "no-store" }),
      fetch("/api/admin/setup", { cache: "no-store" })
    ]);

    state = await stateRes.json();
    setupData = await setupRes.json();

    buildFilters();
    renderStats();
    renderLastCatch();
    renderTop3();
    renderTop3FishTeams();
    renderBoard();

    const statusText = document.getElementById("statusText");
    const footerInfo = document.getElementById("footerInfo");

    if (statusText) statusText.textContent = "Live dáta aktualizované";
    if (footerInfo) {
      footerInfo.textContent =
        `Počet tímov: ${filteredLeaderboard().length} • Posledná aktualizácia: ${new Date().toLocaleTimeString("sk-SK")}`;
    }
  } catch (e) {
    const statusText = document.getElementById("statusText");
    if (statusText) statusText.textContent = "Chyba načítania live dát";
  }
}

updateClock();
setInterval(updateClock, 1000);

loadTV();
setInterval(loadTV, 4000);

requestAnimationFrame(animateBoard);
</script>
