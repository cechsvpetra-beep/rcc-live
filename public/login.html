<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cech SV Petra</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cech SV Petra">

<style>
body{
    margin:0;
    font-family:Arial;
    background:radial-gradient(circle at top left,#112034 0%, #0b0f14 60%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:16px;
}

.box{
    background:#101826;
    border:1px solid #243244;
    padding:30px;
    border-radius:16px;
    width:320px;
    max-width:100%;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #2c3b4d;
    background:#0b1220;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#error{
    color:#ff6b6b;
    margin-top:10px;
    min-height:24px;
}

.logo{
    width:80px;
    margin-bottom:10px;
    border-radius:14px;
}

.sub{
    color:#9db0c5;
    margin-top:-10px;
    margin-bottom:18px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">

<img src="/logo.png" class="logo" alt="Logo">

<h1>Cech SV Petra</h1>
<div class="sub">Prihlásenie pre admina aj rozhodcov</div>

<input id="username" placeholder="Meno">
<input id="password" type="password" placeholder="Heslo">

<button onclick="login()">PRIHLÁSIŤ</button>

<div id="error"></div>

</div>

<script>
async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("/api/login", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ username, password }),
            credentials:"same-origin"
        });

        const data = await res.json();

        if (!data.ok) {
            document.getElementById("error").innerText = "Zlé meno alebo heslo, alebo účet nie je aktívny";
            return;
        }

        if (data.role === "admin") {
            window.location.href = "/admin.html";
        } else {
            window.location.href = "/judge.html";
        }
    } catch (e) {
        console.error(e);
        document.getElementById("error").innerText = "Server neodpovedá";
    }
}
</script>

</body>
</html>
