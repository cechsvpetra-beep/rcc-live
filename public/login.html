<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCC Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:radial-gradient(circle at top left,#112034 0%, #0b0f14 60%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#101826;
    border:1px solid #243244;
    padding:30px;
    border-radius:16px;
    width:320px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #2c3b4d;
    background:#0b1220;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#error{
    color:#ff6b6b;
    margin-top:10px;
    min-height:18px;
}

.logo{
    width:80px;
    margin-bottom:10px;
}
.hint{
    color:#9db0c5;
    font-size:13px;
    margin-top:10px;
    line-height:1.45;
}
</style>
</head>

<body>

<div class="box">

<img src="/logo.png" class="logo">

<h1>RCC Login</h1>

<input id="username" placeholder="Meno / login" autocomplete="username">
<input id="password" type="password" placeholder="Heslo" autocomplete="current-password">

<button onclick="login()">PRIHLÁSIŤ</button>

<div id="error"></div>
<div class="hint">Admin aj rozhodcovia sa prihlasujú cez tento formulár.</div>

</div>

<script>
async function login(){
    const errorEl = document.getElementById("error");
    errorEl.innerText = "";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if(!username || !password){
        errorEl.innerText = "Zadaj meno aj heslo";
        return;
    }

    try{
        const res = await fetch("/api/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username,password}),
            credentials:"same-origin"
        });

        const data = await res.json();

        if(!data.ok){
            errorEl.innerText = "Zlé meno alebo heslo, alebo účet nie je aktívny";
            return;
        }

        if(data.role === "admin"){
            window.location.href = "/admin.html";
        }else{
            window.location.href = "/judge.html";
        }
    }catch(e){
        errorEl.innerText = "Server neodpovedá";
    }
}
</script>

</body>
</html>
