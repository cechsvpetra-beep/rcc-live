<script>
let state = null;
let setupData = null;
let currentSector = "all";

async function loadLive() {
  try {
    const [stateRes, setupRes] = await Promise.all([
      fetch("/api/state", { cache: "no-store" }),
      fetch("/api/admin/setup", { cache: "no-store" })
    ]);

    state = await stateRes.json();
    setupData = await setupRes.json();

    renderSectorFilters();
    renderStats();
    renderLastCatch();
    renderTop3Teams();
    renderTable();
    renderMobileCards();
    setStatus("Live dáta aktualizované");
  } catch (err) {
    console.error(err);
    setStatus("Chyba načítania live dát");
  }
}

function setStatus(text) {
  const el = document.getElementById("statusText");
  if (el) el.textContent = text;
}

function medalForPlace(index) {
  if (index === 0) return "🥇";
  if (index === 1) return "🥈";
  if (index === 2) return "🥉";
  return (index + 1);
}

function rowClass(index) {
  if (index === 0) return "top1";
  if (index === 1) return "top2";
  if (index === 2) return "top3";
  return "";
}

function top3RowClass(index) {
  if (index === 0) return "place1";
  if (index === 1) return "place2";
  if (index === 2) return "place3";
  return "";
}

function fmtTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleString("sk-SK");
  } catch {
    return iso;
  }
}

function exportPDF() {
  window.print();
}

function visibleSectors() {
  const sectors = setupData?.sectors || {};
  return Object.values(sectors)
    .filter(s => s && s.visible)
    .sort((a, b) => String(a.code).localeCompare(String(b.code)));
}

function sectorDisplayName(code) {
  const sector = setupData?.sectors?.[code];
  return sector?.name || `Sektor ${code}`;
}

function renderSectorFilters() {
  const wrap = document.getElementById("filters");
  if (!wrap) return;

  const sectors = visibleSectors();

  wrap.innerHTML = `
    <button class="filterBtn ${currentSector === "all" ? "active" : ""}" onclick="setSectorFilter('all')">
      Všetko
    </button>
  `;

  sectors.forEach(sector => {
    wrap.innerHTML += `
      <button class="filterBtn ${currentSector === sector.code ? "active" : ""}" onclick="setSectorFilter('${sector.code}')">
        ${sector.code}
      </button>
    `;
  });

  if (
    currentSector !== "all" &&
    !sectors.some(s => s.code === currentSector)
  ) {
    currentSector = "all";
    renderSectorFilters();
  }
}

function setSectorFilter(code) {
  currentSector = code;
  renderSectorFilters();
  renderTop3Teams();
  renderTable();
  renderMobileCards();
}

function teamPhotoHtml(photo) {
  if (photo) {
    return `<img class="teamThumb" src="${photo}" alt="Foto tímu">`;
  }
  return `<div class="thumbPlaceholder">bez foto</div>`;
}

function teamPhotoLargeHtml(photo) {
  if (photo) {
    return `<img class="teamThumbLarge" src="${photo}" alt="Foto tímu">`;
  }
  return `<div class="thumbPlaceholderLarge">bez foto</div>`;
}

function showMain() {
  const detailView = document.getElementById("detailView");
  const mainView = document.getElementById("mainView");
  const backBtn = document.getElementById("backBtn");

  if (detailView) detailView.classList.add("hidden");
  if (mainView) mainView.classList.remove("hidden");
  if (backBtn) backBtn.classList.add("hidden");
}

function filteredLeaderboard() {
  if (!state || !state.lb) return [];

  const visibleCodes = visibleSectors().map(s => s.code);

  let data = state.lb.filter(t => visibleCodes.includes(t.sectorCode || t.sector));

  if (currentSector === "all") return data;

  return data.filter(t => (t.sectorCode || t.sector) === currentSector);
}

function renderStats() {
  if (!state) return;

  const totalWeight = document.getElementById("totalWeight");
  const totalFish = document.getElementById("totalFish");
  const topFishWeight = document.getElementById("topFishWeight");
  const topFishTeam = document.getElementById("topFishTeam");

  if (totalWeight) totalWeight.innerText = Number(state.totalWeight || 0).toFixed(2) + " kg";
  if (totalFish) totalFish.innerText = state.totalFish || 0;

  if (state.topFish) {
    if (topFishWeight) topFishWeight.innerText = Number(state.topFish.weight || 0).toFixed(2) + " kg";
    if (topFishTeam) topFishTeam.innerText = state.topFish.team || "—";
  } else {
    if (topFishWeight) topFishWeight.innerText = "0.00 kg";
    if (topFishTeam) topFishTeam.innerText = "—";
  }
}

function renderLastCatch() {
  const box = document.getElementById("lastCatchText");
  if (!box || !state) return;

  let last = null;
  let lastTeam = null;

  Object.keys(state.teamCatches || {}).forEach(teamId => {
    const arr = state.teamCatches[teamId] || [];
    arr.forEach(c => {
      if (!last || new Date(c.time) > new Date(last.time)) {
        last = c;
        const team = state.lb.find(t => Number(t.id) === Number(teamId));
        lastTeam = team ? team.name : ("Tím " + teamId);
      }
    });
  });

  if (!last) {
    box.textContent = "Zatiaľ bez úlovku";
    return;
  }

  box.textContent = `${lastTeam} • ${Number(last.weight).toFixed(2)} kg • ${fmtTime(last.time)}`;
}

function renderTop3Teams() {
  const body = document.getElementById("top3teamsBody");
  if (!body || !state) return;

  body.innerHTML = "";

  const visibleCodes = visibleSectors().map(s => s.code);

  let data = (state.top3teams || []).filter(t =>
    visibleCodes.includes(t.sectorCode || t.sector)
  );

  if (currentSector !== "all") {
    data = data.filter(t => (t.sectorCode || t.sector) === currentSector);
  }

  const top3 = data.slice(0, 3);

  top3.forEach((t, i) => {
    body.innerHTML += `
      <tr class="${top3RowClass(i)}">
        <td class="rankCell"><span class="medal">${medalForPlace(i)}</span></td>
        <td>
          <div class="teamName" onclick="showTeam(${t.id})">${t.name}</div>
          <div class="smallMeta">${sectorDisplayName(t.sectorCode || t.sector)} • Stanovište ${t.peg}</div>
        </td>
        <td class="weight">${Number(t.top3?.[0] || 0).toFixed(2)} kg</td>
        <td class="weight">${Number(t.top3?.[1] || 0).toFixed(2)} kg</td>
        <td class="weight">${Number(t.top3?.[2] || 0).toFixed(2)} kg</td>
        <td class="weight">${Number(t.top3sum || 0).toFixed(2)} kg</td>
      </tr>
    `;
  });

  if (!top3.length) {
    body.innerHTML = `<tr><td colspan="6" class="empty">Zatiaľ nie sú dáta pre TOP 3 ryby tímov.</td></tr>`;
  }
}

function renderTable() {
  const body = document.getElementById("tableBody");
  if (!body) return;

  body.innerHTML = "";

  const data = filteredLeaderboard();

  data.forEach((t, i) => {
    body.innerHTML += `
      <tr class="${rowClass(i)}">
        <td class="rankCell"><span class="medal">${medalForPlace(i)}</span></td>
        <td>
          <div class="teamName" onclick="showTeam(${t.id})">${t.name}</div>
          <div class="smallMeta">${t.count} úlovkov • najväčšia ${Number(t.biggest).toFixed(2)} kg</div>
        </td>
        <td>${sectorDisplayName(t.sectorCode || t.sector)}</td>
        <td>${t.peg}</td>
        <td>${teamPhotoHtml(t.photo)}</td>
        <td class="weight">${Number(t.total).toFixed(2)} kg</td>
        <td><button class="detailBtn" onclick="showTeam(${t.id})">ÚLOVKY</button></td>
      </tr>
    `;
  });

  if (!data.length) {
    body.innerHTML = `<tr><td colspan="7" class="empty">V tomto výbere zatiaľ nie sú žiadne tímy.</td></tr>`;
  }
}

function renderMobileCards() {
  const wrap = document.getElementById("mobileCards");
  if (!wrap) return;

  wrap.innerHTML = "";

  const data = filteredLeaderboard();

  data.forEach((t, i) => {
    wrap.innerHTML += `
      <div class="teamCard ${rowClass(i)}">
        <div class="teamCardHead">
          <div class="teamCardRank">${medalForPlace(i)}</div>
          <div>${teamPhotoHtml(t.photo)}</div>
          <div style="flex:1;">
            <div class="teamCardName" onclick="showTeam(${t.id})">${t.name}</div>
            <div class="teamCardMeta">
              ${sectorDisplayName(t.sectorCode || t.sector)} • Stanovište ${t.peg}<br>
              ${t.count} úlovkov • najväčšia ${Number(t.biggest).toFixed(2)} kg
            </div>
          </div>
          <div class="teamCardWeight">${Number(t.total).toFixed(2)} kg</div>
        </div>

        <div class="teamCardBottom">
          <div style="color:var(--muted);font-size:13px;">Celkové poradie ${i + 1}</div>
          <button class="detailBtn" onclick="showTeam(${t.id})">ÚLOVKY</button>
        </div>
      </div>
    `;
  });

  if (!data.length) {
    wrap.innerHTML = `<div class="empty">V tomto výbere zatiaľ nie sú žiadne tímy.</div>`;
  }
}

function renderTeamChart(catches) {
  const svg = document.getElementById("teamChart");
  if (!svg) return;

  const width = 900;
  const height = 240;
  const left = 55;
  const right = 20;
  const top = 15;
  const bottom = 36;
  const innerW = width - left - right;
  const innerH = height - top - bottom;

  const sorted = [...catches].sort((a, b) => new Date(a.time) - new Date(b.time));
  svg.innerHTML = "";

  if (!sorted.length) {
    svg.innerHTML = `
      <text x="50%" y="50%" text-anchor="middle" class="axisText">Tím zatiaľ nemá žiadny vývoj váhy</text>
    `;
    return;
  }

  let running = 0;
  const points = sorted.map((c, i) => {
    running += Number(c.weight || 0);
    return {
      xIndex: i + 1,
      catchWeight: Number(c.weight || 0),
      total: running
    };
  });

  const maxY = Math.max(...points.map(p => p.total), 1);
  const ySteps = 4;

  for (let i = 0; i <= ySteps; i++) {
    const y = top + (innerH / ySteps) * i;
    const val = ((maxY / ySteps) * (ySteps - i)).toFixed(2);

    svg.innerHTML += `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" class="gridLine"></line>`;
    svg.innerHTML += `<text x="${left - 10}" y="${y + 4}" text-anchor="end" class="axisText">${val}</text>`;
  }

  let path = "";

  points.forEach((p, i) => {
    const x = left + ((points.length === 1 ? innerW / 2 : (innerW / (points.length - 1)) * i));
    const y = top + innerH - ((p.total / maxY) * innerH);

    p.x = x;
    p.y = y;

    path += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);

    const barX = x - 14;
    const barY = y;
    const barH = top + innerH - y;
    svg.innerHTML += `<rect x="${barX}" y="${barY}" width="28" height="${barH}" class="bar"></rect>`;
  });

  svg.innerHTML += `<path d="${path}" class="linePath"></path>`;

  points.forEach((p, i) => {
    svg.innerHTML += `<circle cx="${p.x}" cy="${p.y}" r="6" class="point"></circle>`;
    svg.innerHTML += `<text x="${p.x}" y="${p.y - 12}" text-anchor="middle" class="pointLabel">${p.total.toFixed(2)}</text>`;
    svg.innerHTML += `<text x="${p.x}" y="${height - 12}" text-anchor="middle" class="axisText">#${i + 1}</text>`;
  });
}

function showTeam(id) {
  if (!state) return;

  const team = state.lb.find(t => Number(t.id) === Number(id));
  if (!team) return;

  const catches = state.teamCatches[id] || [];
  const top3 = team.top3 || [];

  const mainView = document.getElementById("mainView");
  const detailView = document.getElementById("detailView");
  const backBtn = document.getElementById("backBtn");

  if (document.getElementById("teamName")) {
    document.getElementById("teamName").innerText = team.name;
  }

  if (document.getElementById("teamMeta")) {
    document.getElementById("teamMeta").innerText =
      sectorDisplayName(team.sectorCode || team.sector) + " | Stanovište " + team.peg;
  }

  if (document.getElementById("detailTotal")) {
    document.getElementById("detailTotal").innerText = Number(team.total).toFixed(2) + " kg";
  }

  if (document.getElementById("detailCount")) {
    document.getElementById("detailCount").innerText = team.count;
  }

  if (document.getElementById("detailBiggest")) {
    document.getElementById("detailBiggest").innerText = Number(team.biggest).toFixed(2) + " kg";
  }

  if (document.getElementById("detailTeamPhoto")) {
    document.getElementById("detailTeamPhoto").innerHTML = teamPhotoLargeHtml(team.photo);
  }

  if (document.getElementById("detailTop1")) {
    document.getElementById("detailTop1").innerText = `${Number(top3[0] || 0).toFixed(2)} kg`;
  }

  if (document.getElementById("detailTop2")) {
    document.getElementById("detailTop2").innerText = `${Number(top3[1] || 0).toFixed(2)} kg`;
  }

  if (document.getElementById("detailTop3")) {
    document.getElementById("detailTop3").innerText = `${Number(top3[2] || 0).toFixed(2)} kg`;
  }

  if (document.getElementById("detailTop3Sum")) {
    document.getElementById("detailTop3Sum").innerText = `${Number(team.top3sum || 0).toFixed(2)} kg`;
  }

  if (mainView) mainView.classList.add("hidden");
  if (detailView) detailView.classList.remove("hidden");
  if (backBtn) backBtn.classList.remove("hidden");

  renderTeamChart(catches);

  const grid = document.getElementById("catchGrid");
  if (!grid) return;

  grid.innerHTML = "";

  if (!catches.length) {
    grid.innerHTML = `<div class="empty">Tím zatiaľ nemá žiadne úlovky.</div>`;
    return;
  }

  const sorted = [...catches].sort((a, b) => Number(b.weight) - Number(a.weight));

  sorted.forEach((c, index) => {
    grid.innerHTML += `
      <div class="catchCard">
        ${c.photo ? `<img class="catchImg" src="${c.photo}" alt="Úlovok">` : ""}
        <div class="catchInside">
          <div class="catchWeight">${Number(c.weight).toFixed(2)} kg</div>
          <div class="catchMeta">
            Úlovok #${c.number ?? (index + 1)}<br>
            ${fmtTime(c.time)}
          </div>
        </div>
      </div>
    `;
  });
}

loadLive();
setInterval(loadLive, 4000);
</script>
