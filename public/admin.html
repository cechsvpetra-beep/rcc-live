<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCC Admin</title>
<style>
:root{
  --bg:#0b1220;
  --panel:#101826;
  --panel2:#0c1220;
  --line:#243244;
  --text:#eef4fb;
  --muted:#9db0c5;
  --green:#22c55e;
  --greenDark:#16a34a;
  --red:#ff6b6b;
  --orange:#f59e0b;
  --blue:#60a5fa;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top left,#112034 0%, #0b0f14 60%);
  color:var(--text);
  padding:20px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  width:64px;
  height:64px;
  object-fit:contain;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}
h1{
  margin:0;
  font-size:28px;
}
.sub{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:var(--green);
  color:black;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:var(--greenDark);
}
button.secondary{
  background:#243141;
  color:white;
}
button.secondary:hover{
  background:#2f3f55;
}
button.danger{
  background:#7f1d1d;
  color:white;
}
button.danger:hover{
  background:#991b1b;
}
.section{
  background:linear-gradient(180deg,var(--panel) 0%, #0e1522 100%);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}
.section h2{
  margin:0 0 6px 0;
  font-size:22px;
}
.sectionSub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:14px;
}
#status{
  margin:0 0 16px 0;
  font-weight:bold;
  color:#8dffb2;
}
.rowSector{
  display:grid;
  grid-template-columns:80px 1fr 120px;
  gap:10px;
  margin-bottom:10px;
  padding:10px;
  border:1px solid #2a3340;
  border-radius:10px;
  background:#111826;
  align-items:center;
}
.rowTeam{
  display:grid;
  grid-template-columns:60px 1.4fr 90px 90px 110px 180px 120px;
  gap:10px;
  margin-bottom:10px;
  padding:10px;
  border:1px solid #2a3340;
  border-radius:10px;
  background:#111826;
  align-items:center;
}
input,select{
  width:100%;
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #2c3b4d;
  background:var(--panel2);
  color:white;
}
input[type="file"]{
  padding:6px;
}
label.inline{
  display:flex;
  align-items:center;
  gap:8px;
}
.photoBox{
  display:flex;
  justify-content:center;
}
.photoThumb{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #233140;
  background:#101722;
}
.photoPlaceholder{
  width:58px;
  height:58px;
  border-radius:50%;
  border:2px dashed #314256;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8ea0b3;
  font-size:11px;
}
.small{
  color:var(--muted);
  font-size:11px;
}
.footerActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}
.catchTools{
  display:grid;
  grid-template-columns:1fr 180px 120px;
  gap:10px;
  margin-bottom:14px;
}
.catchCard{
  display:grid;
  grid-template-columns:90px 1.3fr 140px 140px 190px;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
  padding:12px;
  border:1px solid #2a3340;
  border-radius:12px;
  background:#111826;
}
.catchPhoto{
  width:72px;
  height:72px;
  border-radius:12px;
  object-fit:cover;
  background:#0f1725;
  border:1px solid #263446;
}
.catchNoPhoto{
  width:72px;
  height:72px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:#8ea0b3;
  border:1px dashed #314256;
  background:#0f1725;
}
.catchMetaTitle{
  font-size:16px;
  font-weight:900;
}
.catchMetaSub{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
.inlineCol{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.inlineButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  background:#162233;
  color:#cfe0f3;
}
.empty{
  color:var(--muted);
  padding:14px 0;
}
@media (max-width:1200px){
  .rowTeam{
    grid-template-columns:60px 1fr 90px 90px 110px 1fr 120px;
  }
  .catchCard{
    grid-template-columns:90px 1fr 140px 140px;
  }
}
@media (max-width:900px){
  body{padding:12px}
  .rowSector{
    grid-template-columns:60px 1fr;
  }
  .rowSector label{
    grid-column:1 / -1;
  }
  .rowTeam,
  .catchCard,
  .catchTools{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/logo.png" alt="RCC logo" class="logo">
    <div>
      <h1>Admin – RCC</h1>
      <div class="sub">Sektory, tímy, stanovištia, aktivácia, fotky tímov a úprava úlovkov</div>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" onclick="window.location.href='/live.html'">LIVE</button>
    <button class="secondary" onclick="logout()">Odhlásiť</button>
  </div>
</div>

<div id="status"></div>

<div class="section">
  <h2>Sektory</h2>
  <div class="sectionSub">Názvy sektorov a ich viditeľnosť.</div>
  <div id="sectors"></div>
</div>

<div class="section">
  <h2>Tímy</h2>
  <div class="sectionSub">Názvy tímov, stanovištia, aktivácia a fotky tímov.</div>
  <div id="teams"></div>

  <div class="footerActions">
    <button onclick="saveAdmin()">ULOŽIŤ</button>
  </div>
</div>

<div class="section">
  <h2>Úlovky</h2>
  <div class="sectionSub">Admin môže opraviť chybný tím, váhu alebo úlovok úplne zmazať.</div>

  <div class="catchTools">
    <input id="catchSearch" placeholder="Hľadať tím alebo stanovište..." oninput="renderCatches()">
    <select id="catchSectorFilter" onchange="renderCatches()">
      <option value="all">Všetky sektory</option>
    </select>
    <select id="catchLimit" onchange="renderCatches()">
      <option value="20">Posledných 20</option>
      <option value="50" selected>Posledných 50</option>
      <option value="100">Posledných 100</option>
      <option value="99999">Všetko</option>
    </select>
  </div>

  <div id="catches"></div>
</div>

<script>
let adminData = null;
let stateData = null;
let allCatches = [];
const SECTOR_CODES = ["A","B","C","D","E","F","G","H"];

async function loadAdmin() {
  try {
    const meRes = await fetch("/api/me", { cache: "no-store" });
    const me = await meRes.json();

    if (!me || me.role !== "admin") {
      window.location.href = "/login.html";
      return;
    }

    const [adminRes, stateRes] = await Promise.all([
      fetch("/api/admin/setup", { cache: "no-store" }),
      fetch("/api/state", { cache: "no-store" })
    ]);

    adminData = await adminRes.json();
    stateData = await stateRes.json();

    normalizeData();
    await loadCatches();

    renderSectors();
    renderTeams();
    renderCatchSectorFilter();
    renderCatches();

    setStatus("Dáta načítané");
  } catch (e) {
    console.error(e);
    setStatus("Chyba načítania", true);
  }
}

async function loadCatches() {
  try {
    const res = await fetch("/api/admin/catches", { cache: "no-store" });
    const out = await res.json();
    allCatches = Array.isArray(out.catches) ? out.catches : [];
  } catch (e) {
    console.error(e);
    allCatches = [];
  }
}

function setStatus(text, isError = false) {
  const el = document.getElementById("status");
  if (!el) return;
  el.innerText = text;
  el.style.color = isError ? "var(--red)" : "#8dffb2";
}

function normalizeData() {
  if (!adminData) adminData = {};

  if (!adminData.sectors || typeof adminData.sectors !== "object") {
    adminData.sectors = {};
  }

  SECTOR_CODES.forEach((code, index) => {
    if (!adminData.sectors[code]) {
      adminData.sectors[code] = {
        code,
        name: "Sektor " + code,
        visible: index < 4
      };
    } else {
      adminData.sectors[code].code = code;
      adminData.sectors[code].name = adminData.sectors[code].name || ("Sektor " + code);
      adminData.sectors[code].visible = Boolean(adminData.sectors[code].visible);
    }
  });

  if (!Array.isArray(adminData.teams)) {
    adminData.teams = [];
  }

  if (adminData.teams.length < 50) {
    for (let i = adminData.teams.length + 1; i <= 50; i++) {
      adminData.teams.push({
        id: i,
        name: "Tím " + i,
        sector: "A",
        peg: String(i),
        active: i <= 20,
        photo: null
      });
    }
  }

  adminData.teams = adminData.teams.map((t, index) => ({
    id: Number(t.id || index + 1),
    name: t.name || ("Tím " + (index + 1)),
    sector: SECTOR_CODES.includes(t.sector) ? t.sector : "A",
    peg: String(t.peg || (index + 1)),
    active: Boolean(t.active),
    photo: t.photo || null
  })).sort((a, b) => a.id - b.id);
}

function renderSectors() {
  const wrap = document.getElementById("sectors");
  if (!wrap) return;

  wrap.innerHTML = "";

  SECTOR_CODES.forEach(code => {
    const s = adminData.sectors[code];

    wrap.innerHTML += `
      <div class="rowSector">
        <div><b>${code}</b></div>

        <input
          value="${escapeHtml(s.name)}"
          onchange="changeSectorName('${code}',this.value)"
        >

        <label class="inline">
          <input
            type="checkbox"
            ${s.visible ? "checked" : ""}
            onchange="changeSectorVisible('${code}',this.checked)">
          zobraziť
        </label>
      </div>
    `;
  });
}

function renderTeams() {
  const wrap = document.getElementById("teams");
  if (!wrap) return;

  wrap.innerHTML = "";

  adminData.teams.forEach(t => {
    wrap.innerHTML += `
      <div class="rowTeam">
        <div>#${t.id}</div>

        <input
          value="${escapeHtml(t.name)}"
          onchange="changeTeamName(${t.id},this.value)"
        >

        <select onchange="changeTeamSector(${t.id},this.value)">
          ${SECTOR_CODES.map(code => `
            <option value="${code}" ${t.sector === code ? "selected" : ""}>${code}</option>
          `).join("")}
        </select>

        <input
          value="${escapeHtml(t.peg)}"
          onchange="changeTeamPeg(${t.id},this.value)"
        >

        <label class="inline">
          <input
            type="checkbox"
            ${t.active ? "checked" : ""}
            onchange="changeTeamActive(${t.id},this.checked)">
          aktívny
        </label>

        <div>
          <input
            type="file"
            accept="image/*"
            onchange="uploadTeamPhoto(${t.id}, this)"
          >
          <div class="small">fotka tímu</div>
        </div>

        <div class="photoBox">
          ${renderPhotoThumb(t.photo)}
        </div>
      </div>
    `;
  });
}

function renderCatchSectorFilter() {
  const el = document.getElementById("catchSectorFilter");
  if (!el) return;

  const current = el.value || "all";

  el.innerHTML = `<option value="all">Všetky sektory</option>`;
  SECTOR_CODES.forEach(code => {
    el.innerHTML += `<option value="${code}">${code}</option>`;
  });

  el.value = SECTOR_CODES.includes(current) || current === "all" ? current : "all";
}

function renderCatches() {
  const wrap = document.getElementById("catches");
  if (!wrap) return;

  const search = (document.getElementById("catchSearch")?.value || "").trim().toLowerCase();
  const sectorFilter = document.getElementById("catchSectorFilter")?.value || "all";
  const limit = Number(document.getElementById("catchLimit")?.value || 50);

  let data = [...allCatches].sort((a, b) => new Date(b.time) - new Date(a.time));

  if (search) {
    data = data.filter(c => {
      const hay = [
        c.teamName,
        c.teamSector,
        c.teamPeg,
        c.teamId
      ].join(" ").toLowerCase();

      return hay.includes(search);
    });
  }

  if (sectorFilter !== "all") {
    data = data.filter(c => c.teamSector === sectorFilter);
  }

  data = data.slice(0, limit);

  wrap.innerHTML = "";

  if (!data.length) {
    wrap.innerHTML = `<div class="empty">Zatiaľ nie sú k dispozícii žiadne úlovky.</div>`;
    return;
  }

  data.forEach(c => {
    wrap.innerHTML += `
      <div class="catchCard">
        <div>
          ${c.photo ? `<img src="${c.photo}" class="catchPhoto" alt="Úlovok">` : `<div class="catchNoPhoto">bez foto</div>`}
        </div>

        <div>
          <div class="catchMetaTitle">${escapeHtml(c.teamName || ("Tím " + c.teamId))}</div>
          <div class="catchMetaSub">
            Sektor ${escapeHtml(c.teamSector || "-")} • Stanovište ${escapeHtml(String(c.teamPeg || "-"))}<br>
            Čas: ${escapeHtml(formatDateTime(c.time))}<br>
            ID úlovku: ${escapeHtml(String(c.id))}
          </div>
        </div>

        <div class="inlineCol">
          <div class="small">Tím</div>
          <select id="catchTeam_${c.id}">
            ${adminData.teams
              .filter(t => t.active)
              .map(t => `<option value="${t.id}" ${Number(t.id) === Number(c.teamId) ? "selected" : ""}>${escapeHtml(t.name)} – ${escapeHtml(t.sector)} / ${escapeHtml(String(t.peg))}</option>`)
              .join("")}
          </select>
        </div>

        <div class="inlineCol">
          <div class="small">Váha (kg)</div>
          <input id="catchWeight_${c.id}" type="number" step="0.01" min="0" value="${escapeHtml(String(c.weight))}">
        </div>

        <div class="inlineCol">
          <div class="small">Akcie</div>
          <div class="inlineButtons">
            <button onclick="saveCatchEdit(${c.id})">Uložiť</button>
            <button class="danger" onclick="deleteCatch(${c.id})">Zmazať</button>
          </div>
          <div class="small">
            <span class="tag">${escapeHtml(String(c.weight))} kg</span>
          </div>
        </div>
      </div>
    `;
  });
}

function renderPhotoThumb(photo) {
  if (photo) {
    return `<img src="${photo}" alt="foto tímu" class="photoThumb">`;
  }
  return `<div class="photoPlaceholder">bez foto</div>`;
}

function changeSectorName(code, value) {
  adminData.sectors[code].name = value.trim() || ("Sektor " + code);
}

function changeSectorVisible(code, value) {
  adminData.sectors[code].visible = Boolean(value);
}

function getTeam(id) {
  return adminData.teams.find(t => Number(t.id) === Number(id));
}

function changeTeamName(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.name = value.trim() || ("Tím " + id);
}

function changeTeamSector(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.sector = SECTOR_CODES.includes(value) ? value : "A";
}

function changeTeamPeg(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.peg = value.trim() || String(id);
}

function changeTeamActive(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.active = Boolean(value);
}

async function uploadTeamPhoto(teamId, input) {
  const file = input.files && input.files[0];
  if (!file) return;

  try {
    setStatus(`Nahrávam fotku pre tím ${teamId}...`);

    const form = new FormData();
    form.append("photo", file);

    const res = await fetch(`/api/team-photo/${teamId}`, {
      method: "POST",
      body: form
    });

    const out = await res.json();

    if (out.ok) {
      const team = getTeam(teamId);
      if (team) {
        team.photo = out.path || out.photo || team.photo;
      }
      renderTeams();
      setStatus(`Fotka pre tím ${teamId} uložená`);
    } else {
      setStatus(out.error || "Chyba uploadu fotky", true);
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá pri uploade fotky", true);
  }
}

async function saveAdmin() {
  try {
    normalizeData();

    const payload = {
      sectors: adminData.sectors,
      teams: adminData.teams
    };

    const res = await fetch("/api/admin/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const out = await res.json();

    if (out.ok) {
      setStatus("ULOŽENÉ ✔");
      await loadCatches();
      renderCatches();
    } else {
      setStatus("Chyba ukladania", true);
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá", true);
  }
}

async function saveCatchEdit(catchId) {
  const teamId = Number(document.getElementById(`catchTeam_${catchId}`)?.value || 0);
  const weight = Number(document.getElementById(`catchWeight_${catchId}`)?.value || 0);

  if (!teamId || !weight) {
    setStatus("Vyber tím a zadaj platnú váhu", true);
    return;
  }

  try {
    setStatus(`Ukladám úlovok ${catchId}...`);

    const res = await fetch(`/api/admin/catch-update/${catchId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ teamId, weight })
    });

    const out = await res.json();

    if (out.ok) {
      await Promise.all([reloadAdminSetupOnly(), loadCatches()]);
      renderTeams();
      renderCatchSectorFilter();
      renderCatches();
      setStatus(`Úlovok ${catchId} upravený ✔`);
    } else {
      setStatus(out.error || "Nepodarilo sa upraviť úlovok", true);
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá pri úprave úlovku", true);
  }
}

async function deleteCatch(catchId) {
  const ok = confirm(`Naozaj chceš zmazať úlovok ${catchId}?`);
  if (!ok) return;

  try {
    setStatus(`Mažem úlovok ${catchId}...`);

    const res = await fetch(`/api/admin/catch-delete/${catchId}`, {
      method: "POST"
    });

    const out = await res.json();

    if (out.ok) {
      await Promise.all([reloadAdminSetupOnly(), loadCatches()]);
      renderTeams();
      renderCatchSectorFilter();
      renderCatches();
      setStatus(`Úlovok ${catchId} zmazaný ✔`);
    } else {
      setStatus(out.error || "Nepodarilo sa zmazať úlovok", true);
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá pri mazaní úlovku", true);
  }
}

async function reloadAdminSetupOnly() {
  const res = await fetch("/api/admin/setup", { cache: "no-store" });
  adminData = await res.json();
  normalizeData();
}

async function logout() {
  try {
    await fetch("/api/logout", { method: "POST" });
  } catch (e) {}
  window.location.href = "/login.html";
}

function formatDateTime(iso) {
  try {
    return new Date(iso).toLocaleString("sk-SK");
  } catch {
    return iso || "";
  }
}

function escapeHtml(text) {
  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

loadAdmin();
</script>

</body>
</html>
