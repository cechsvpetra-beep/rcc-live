<script>
let adminData = null

const SECTOR_CODES = ["A","B","C","D","E","F","G","H"]

async function loadAdmin(){

    try{

        const r = await fetch("/api/admin/setup",{cache:"no-store"})
        adminData = await r.json()

        normalizeData()

        renderSectors()
        renderTeams()

        setStatus("Dáta načítané")

    }catch(e){

        console.log(e)
        setStatus("Chyba načítania")

    }

}

function setStatus(text){

    const el = document.getElementById("status")
    if(el) el.innerText = text

}

function normalizeData(){

    if(!adminData) adminData = {}

    if(!adminData.sectors) adminData.sectors = {}

    SECTOR_CODES.forEach((code,index)=>{

        if(!adminData.sectors[code]){

            adminData.sectors[code] = {

                code:code,
                name:"Sektor "+code,
                visible:index < 4

            }

        }

    })

    if(!Array.isArray(adminData.teams)) adminData.teams = []

    if(adminData.teams.length < 50){

        for(let i=adminData.teams.length+1;i<=50;i++){

            adminData.teams.push({

                id:i,
                name:"Tím "+i,
                sector:"A",
                peg:String(i),
                active:i<=20,
                photo:null

            })

        }

    }

}

function renderSectors(){

    const wrap = document.getElementById("sectors")

    wrap.innerHTML = ""

    SECTOR_CODES.forEach(code=>{

        const s = adminData.sectors[code]

        wrap.innerHTML += `

        <div style="display:grid;grid-template-columns:80px 1fr 120px;gap:10px;margin-bottom:8px;">

            <div><b>${code}</b></div>

            <input
            value="${escapeHtml(s.name)}"
            onchange="changeSectorName('${code}',this.value)">

            <label>
                <input
                type="checkbox"
                ${s.visible ? "checked":""}
                onchange="changeSectorVisible('${code}',this.checked)">
                zobraziť
            </label>

        </div>

        `

    })

}

function renderTeams(){

    const wrap = document.getElementById("teams")

    wrap.innerHTML = ""

    adminData.teams.forEach(t=>{

        wrap.innerHTML += `

        <div style="display:grid;grid-template-columns:60px 1.5fr 120px 120px 110px;gap:10px;margin-bottom:8px;">

            <div>#${t.id}</div>

            <input
            value="${escapeHtml(t.name)}"
            onchange="changeTeamName(${t.id},this.value)">

            <select onchange="changeTeamSector(${t.id},this.value)">

                ${SECTOR_CODES.map(code=>`
                    <option value="${code}" ${t.sector===code?"selected":""}>
                        ${code}
                    </option>
                `).join("")}

            </select>

            <input
            value="${escapeHtml(t.peg)}"
            onchange="changeTeamPeg(${t.id},this.value)">

            <label>
                <input
                type="checkbox"
                ${t.active?"checked":""}
                onchange="changeTeamActive(${t.id},this.checked)">
                aktívny
            </label>

        </div>

        `

    })

}

function changeSectorName(code,value){

    adminData.sectors[code].name = value.trim() || ("Sektor "+code)

}

function changeSectorVisible(code,value){

    adminData.sectors[code].visible = value

}

function getTeam(id){

    return adminData.teams.find(t=>Number(t.id)===Number(id))

}

function changeTeamName(id,value){

    const t = getTeam(id)
    if(!t) return

    t.name = value.trim() || ("Tím "+id)

}

function changeTeamSector(id,value){

    const t = getTeam(id)
    if(!t) return

    t.sector = value

}

function changeTeamPeg(id,value){

    const t = getTeam(id)
    if(!t) return

    t.peg = value

}

function changeTeamActive(id,value){

    const t = getTeam(id)
    if(!t) return

    t.active = value

}

async function saveAdmin(){

    try{

        const res = await fetch("/api/admin/setup",{

            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(adminData)

        })

        const out = await res.json()

        if(out.ok){

            setStatus("Uložené")

        }else{

            setStatus("Chyba ukladania")

        }

    }catch(e){

        console.log(e)
        setStatus("Server neodpovedá")

    }

}

function escapeHtml(text){

    return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")

}

loadAdmin()
</script>
