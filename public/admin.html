<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCC Admin</title>
<style>
:root{
  --bg:#0b1220;
  --panel:#101826;
  --panel2:#0c1220;
  --line:#243244;
  --text:#eef4fb;
  --muted:#9db0c5;
  --green:#22c55e;
  --red:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top left,#112034 0%, #0b0f14 60%);
  color:var(--text);
  padding:20px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  width:64px;
  height:64px;
  object-fit:contain;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}
h1{
  margin:0;
  font-size:28px;
}
.sub{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:var(--green);
  color:black;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{
  background:#243141;
  color:white;
}
.section{
  background:linear-gradient(180deg,var(--panel) 0%, #0e1522 100%);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}
.section h2{
  margin:0 0 14px 0;
  font-size:22px;
}
#status{
  margin:0 0 16px 0;
  font-weight:bold;
  color:#8dffb2;
}
.rowSector{
  display:grid;
  grid-template-columns:80px 1fr 120px;
  gap:10px;
  margin-bottom:10px;
  padding:10px;
  border:1px solid #2a3340;
  border-radius:10px;
  background:#111826;
  align-items:center;
}
.rowTeam{
  display:grid;
  grid-template-columns:60px 1.5fr 90px 90px 110px 170px 120px;
  gap:10px;
  margin-bottom:10px;
  padding:10px;
  border:1px solid #2a3340;
  border-radius:10px;
  background:#111826;
  align-items:center;
}
input,select{
  width:100%;
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #2c3b4d;
  background:var(--panel2);
  color:white;
}
label.inline{
  display:flex;
  align-items:center;
  gap:8px;
}
.photoBox{
  display:flex;
  justify-content:center;
}
.photoThumb{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #233140;
  background:#101722;
}
.photoPlaceholder{
  width:58px;
  height:58px;
  border-radius:50%;
  border:2px dashed #314256;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8ea0b3;
  font-size:11px;
}
.small{
  color:var(--muted);
  font-size:11px;
}
.footerActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}
@media (max-width:1100px){
  .rowTeam{
    grid-template-columns:60px 1fr 80px 80px 100px 1fr 100px;
  }
}
@media (max-width:820px){
  body{padding:12px}
  .rowSector{
    grid-template-columns:60px 1fr;
  }
  .rowSector label{
    grid-column:1 / -1;
  }
  .rowTeam{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/logo.png" alt="RCC logo" class="logo">
    <div>
      <h1>Admin – RCC</h1>
      <div class="sub">Sektory, tímy, stanovištia, aktivácia a fotky tímov</div>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" onclick="window.location.href='/live.html'">LIVE</button>
    <button class="secondary" onclick="logout()">Odhlásiť</button>
  </div>
</div>

<div id="status"></div>

<div class="section">
  <h2>Sektory</h2>
  <div id="sectors"></div>
</div>

<div class="section">
  <h2>Tímy</h2>
  <div id="teams"></div>

  <div class="footerActions">
    <button onclick="saveAdmin()">ULOŽIŤ</button>
  </div>
</div>

<script>
let adminData = null;
const SECTOR_CODES = ["A","B","C","D","E","F","G","H"];

async function loadAdmin() {
  try {
    const meRes = await fetch("/api/me");
const me = await meRes.json();

if(!me || me.role !== "admin"){
  window.location.href = "/login.html";
  return;
}
const meRes = await fetch("/api/me", { cache: "no-store" });
    const me = await meRes.json();

    if (!me || me.role !== "admin") {
      window.location.href = "/login.html";
      return;
    }

    const res = await fetch("/api/admin/setup", { cache: "no-store" });
    adminData = await res.json();

    normalizeData();
    renderSectors();
    renderTeams();
    setStatus("Dáta načítané");
  } catch (e) {
    console.error(e);
    setStatus("Chyba načítania");
  }
}

function setStatus(text, isError = false) {
  const el = document.getElementById("status");
  if (!el) return;
  el.innerText = text;
  el.style.color = isError ? "var(--red)" : "#8dffb2";
}

function normalizeData() {
  if (!adminData) adminData = {};

  if (!adminData.sectors || typeof adminData.sectors !== "object") {
    adminData.sectors = {};
  }

  SECTOR_CODES.forEach((code, index) => {
    if (!adminData.sectors[code]) {
      adminData.sectors[code] = {
        code,
        name: "Sektor " + code,
        visible: index < 4
      };
    } else {
      adminData.sectors[code].code = code;
      adminData.sectors[code].name = adminData.sectors[code].name || ("Sektor " + code);
      adminData.sectors[code].visible = Boolean(adminData.sectors[code].visible);
    }
  });

  if (!Array.isArray(adminData.teams)) {
    adminData.teams = [];
  }

  if (adminData.teams.length < 50) {
    for (let i = adminData.teams.length + 1; i <= 50; i++) {
      adminData.teams.push({
        id: i,
        name: "Tím " + i,
        sector: "A",
        peg: String(i),
        active: i <= 20,
        photo: null
      });
    }
  }

  adminData.teams = adminData.teams.map((t, index) => ({
    id: Number(t.id || index + 1),
    name: t.name || ("Tím " + (index + 1)),
    sector: SECTOR_CODES.includes(t.sector) ? t.sector : "A",
    peg: String(t.peg || (index + 1)),
    active: Boolean(t.active),
    photo: t.photo || null
  })).sort((a, b) => a.id - b.id);
}

function renderSectors() {
  const wrap = document.getElementById("sectors");
  if (!wrap) return;

  wrap.innerHTML = "";

  SECTOR_CODES.forEach(code => {
    const s = adminData.sectors[code];

    wrap.innerHTML += `
      <div class="rowSector">
        <div><b>${code}</b></div>

        <input
          value="${escapeHtml(s.name)}"
          onchange="changeSectorName('${code}',this.value)"
        >

        <label class="inline">
          <input
            type="checkbox"
            ${s.visible ? "checked" : ""}
            onchange="changeSectorVisible('${code}',this.checked)">
          zobraziť
        </label>
      </div>
    `;
  });
}

function renderTeams() {
  const wrap = document.getElementById("teams");
  if (!wrap) return;

  wrap.innerHTML = "";

  adminData.teams.forEach(t => {
    wrap.innerHTML += `
      <div class="rowTeam">
        <div>#${t.id}</div>

        <input
          value="${escapeHtml(t.name)}"
          onchange="changeTeamName(${t.id},this.value)"
        >

        <select onchange="changeTeamSector(${t.id},this.value)">
          ${SECTOR_CODES.map(code => `
            <option value="${code}" ${t.sector === code ? "selected" : ""}>${code}</option>
          `).join("")}
        </select>

        <input
          value="${escapeHtml(t.peg)}"
          onchange="changeTeamPeg(${t.id},this.value)"
        >

        <label class="inline">
          <input
            type="checkbox"
            ${t.active ? "checked" : ""}
            onchange="changeTeamActive(${t.id},this.checked)">
          aktívny
        </label>

        <div>
          <input
            type="file"
            accept="image/*"
            onchange="uploadTeamPhoto(${t.id}, this)"
          >
          <div class="small">fotka tímu</div>
        </div>

        <div class="photoBox">
          ${renderPhotoThumb(t.photo)}
        </div>
      </div>
    `;
  });
}

function renderPhotoThumb(photo) {
  if (photo) {
    return `<img src="${photo}" alt="foto tímu" class="photoThumb">`;
  }
  return `<div class="photoPlaceholder">bez foto</div>`;
}

function changeSectorName(code, value) {
  adminData.sectors[code].name = value.trim() || ("Sektor " + code);
}

function changeSectorVisible(code, value) {
  adminData.sectors[code].visible = Boolean(value);
}

function getTeam(id) {
  return adminData.teams.find(t => Number(t.id) === Number(id));
}

function changeTeamName(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.name = value.trim() || ("Tím " + id);
}

function changeTeamSector(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.sector = SECTOR_CODES.includes(value) ? value : "A";
}

function changeTeamPeg(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.peg = value.trim() || String(id);
}

function changeTeamActive(id, value) {
  const t = getTeam(id);
  if (!t) return;
  t.active = Boolean(value);
}

async function uploadTeamPhoto(teamId, input) {
  const file = input.files && input.files[0];
  if (!file) return;

  try {
    setStatus(`Nahrávam fotku pre tím ${teamId}...`);

    const form = new FormData();
    form.append("photo", file);

    const res = await fetch(`/api/team-photo/${teamId}`, {
      method: "POST",
      body: form
    });

    const out = await res.json();

    if (out.ok) {
      const team = getTeam(teamId);
      if (team) {
        team.photo = out.path || out.photo || team.photo;
      }
      renderTeams();
      setStatus(`Fotka pre tím ${teamId} uložená`);
    } else {
      setStatus(out.error || "Chyba uploadu fotky", true);
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá pri uploade fotky", true);
  }
}

async function saveAdmin() {
  try {
    normalizeData();

    const payload = {
      sectors: adminData.sectors,
      teams: adminData.teams
    };

    const res = await fetch("/api/admin/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const out = await res.json();

    if (out.ok) {
      setStatus("ULOŽENÉ ✔");
    } else {
      setStatus("Chyba ukladania", true);
    }
  } catch (e) {
    console.error(e);
    setStatus("Server neodpovedá", true);
  }
}

async function logout() {
  try {
    await fetch("/api/logout", { method: "POST" });
  } catch (e) {}
  window.location.href = "/login.html";
}

function escapeHtml(text) {
  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

loadAdmin();
</script>

</body>
</html>
